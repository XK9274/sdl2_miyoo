name: Release SDL2 (Miyoo Mini)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.0.22-miyoo1). Leave blank to auto-bump the patch version of the latest release."
        required: false
        type: string

jobs:
  preflight:
    name: Pre-release checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
            if [[ -z "$LATEST_TAG" ]]; then
              TAG="v0.1.0"
              echo "No existing release tags found -- starting at $TAG"
            else
              VER="${LATEST_TAG#v}"
              MAJOR="${VER%%.*}"
              REST="${VER#*.}"
              MINOR="${REST%%.*}"
              PATCH="${REST#*.}"
              PATCH="${PATCH%%-*}"
              TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
              echo "No tag given -- auto-bumping latest release $LATEST_TAG -> $TAG"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Tag '$TAG' does not match vMAJOR.MINOR.PATCH format"
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Verify tag exists on a tracked branch
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BRANCHES=$(git branch -r --contains "HEAD" 2>/dev/null || true)
          if [[ -z "$BRANCHES" ]]; then
            echo "Warning: could not determine containing branches — proceeding"
          else
            echo "Tag is reachable from: $BRANCHES"
          fi

      - name: Check for uncommitted changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Working tree is dirty — release must be built from a clean tree"
            git status
            exit 1
          fi

      - name: Check tag is not a duplicate release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists — bump the version"
            exit 1
          fi

      - name: Verify build-scripts/mk_miyoo.sh is present
        run: |
          if [[ ! -f "build-scripts/mk_miyoo.sh" ]]; then
            echo "build-scripts/mk_miyoo.sh missing from repo"
            exit 1
          fi

      - name: Verify autogen.sh is present
        run: |
          if [[ ! -f "autogen.sh" ]]; then
            echo "autogen.sh missing — source tree is incomplete"
            exit 1
          fi

  build:
    name: Build
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SDL2 source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            make gcc g++ patch \
            git wget

      - name: Install miyoomini toolchain
        run: |
          ARCH=$(uname -m)
          if [[ "$ARCH" == "aarch64" ]]; then
            REPO=miyoomini-toolchain-buildroot-aarch64
          else
            REPO=miyoomini-toolchain-buildroot
          fi
          wget -q "https://github.com/shauninman/$REPO/releases/download/v0.0.3/miyoomini-toolchain.tar.xz" -O /tmp/toolchain.tar.xz
          sudo mkdir -p /opt
          sudo tar -xf /tmp/toolchain.tar.xz -C /opt
          rm /tmp/toolchain.tar.xz

      - name: Build via mk_miyoo.sh
        run: |
          chmod +x build-scripts/mk_miyoo.sh
          ./build-scripts/mk_miyoo.sh --jobs "$(nproc)"

      - name: Verify artifact
        run: |
          LIB="${{ github.workspace }}/output/libSDL2-2.0.so.0"
          if [[ ! -f "$LIB" ]]; then
            echo "Build output not found at $LIB"
            find "${{ github.workspace }}/build" -name "libSDL2*" 2>/dev/null || true
            exit 1
          fi

      - name: Generate checksum
        run: |
          cd "${{ github.workspace }}/output"
          sha256sum libSDL2-2.0.so.0 > libSDL2-2.0.so.0.sha256
          cat libSDL2-2.0.so.0.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: libSDL2-miyoo-${{ needs.preflight.outputs.tag }}
          path: |
            output/libSDL2-2.0.so.0
            output/libSDL2-2.0.so.0.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: libSDL2-miyoo-${{ needs.preflight.outputs.tag }}
          path: output

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.preflight.outputs.tag }}"
          VERSION="${{ needs.preflight.outputs.version }}"

          gh release create "$TAG" \
            output/libSDL2-2.0.so.0 \
            output/libSDL2-2.0.so.0.sha256 \
            --title "SDL2 Miyoo Mini $TAG" \
            --notes "$(cat <<NOTES
          ## SDL2 for Miyoo Mini — $TAG

          Cross-compiled for \`arm-linux-gnueabihf\` using the miyoomini-toolchain.

          ### Artifacts
          | File | Description |
          |------|-------------|
          | \`libSDL2-2.0.so.0\` | Stripped release build |
          | \`libSDL2-2.0.so.0.sha256\` | SHA-256 checksum |

          ### Build info
          - Commit: ${{ github.sha }}
          - Toolchain: [XK9274/union-miyoomini-toolchain](https://github.com/XK9274/union-miyoomini-toolchain)
          - Neon helper: [XK9274/neon-arm-library-miyoo](https://github.com/XK9274/neon-arm-library-miyoo)
          NOTES
          )"
