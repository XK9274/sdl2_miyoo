name: Release SDL2 (Miyoo Mini)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, branch, or tag to build (blank uses the dispatched commit)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  preflight:
    name: Resolve release commit
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.commit.outputs.target_sha }}
      release_tag: ${{ steps.commit.outputs.release_tag }}

    steps:
      - name: Checkout requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Resolve commit marker
        id: commit
        run: |
          TARGET_SHA=$(git rev-parse HEAD)
          RELEASE_TAG="sdl2-miyoo-${TARGET_SHA}"

          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Building commit $TARGET_SHA"

      - name: Check for duplicate release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.commit.outputs.release_tag }}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release '$RELEASE_TAG' already exists for this commit"
            exit 1
          fi

      - name: Verify build inputs
        run: |
          test -f build-scripts/mk_miyoo.sh
          test -f autogen.sh

  build:
    name: Build and package (${{ matrix.variant }})
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: nogl
            description: Non-GL
            gles_flag: --disable-gles
          - variant: gles
            description: GL/EGL
            gles_flag: --enable-gles

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}

      - name: Build via mk_miyoo.sh (${{ matrix.description }})
        run: |
          chmod +x build-scripts/mk_miyoo.sh
          ./build-scripts/mk_miyoo.sh --docker ${{ matrix.gles_flag }} --clean build --jobs "$(nproc)"

      - name: Verify build output
        run: |
          LIB="${{ github.workspace }}/output/libSDL2-2.0.so.0"
          test -f "$LIB"
          file "$LIB"
          readelf -h "$LIB" | grep -E "Class|Machine|Flags"
          readelf -d "$LIB" | grep NEEDED || true

          NEON_LIB="${{ github.workspace }}/libneonarmmiyoo.so"
          test -f "$NEON_LIB" || { echo "Neon helper not built: $NEON_LIB"; exit 1; }

      - name: Package release archive
        id: package
        env:
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          VARIANT: ${{ matrix.variant }}
          DESCRIPTION: ${{ matrix.description }}
        run: |
          ARCHIVE="libSDL2-miyoo-${VARIANT}-${TARGET_SHA}.tar.gz"
          mkdir -p package
          cp output/libSDL2-2.0.so.0 package/
          cp libneonarmmiyoo.so package/
          FILES=(libSDL2-2.0.so.0 libneonarmmiyoo.so)

          if [[ "${{ matrix.variant }}" == "gles" ]]; then
            test -f libEGL.so || { echo "libEGL.so missing for gles variant"; exit 1; }
            test -f libGLESv2.so || { echo "libGLESv2.so missing for gles variant"; exit 1; }
            cp libEGL.so libGLESv2.so package/
            FILES+=(libEGL.so libGLESv2.so)
          fi

          ( cd package && sha256sum "${FILES[@]}" > SHA256SUMS.txt )
          printf 'commit=%s\nvariant=%s\ngles_flag=%s\n' \
            "$TARGET_SHA" "$DESCRIPTION" "${{ matrix.gles_flag }}" > package/BUILD-INFO.txt
          tar -czf "$ARCHIVE" -C package \
            "${FILES[@]}" SHA256SUMS.txt BUILD-INFO.txt
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          cat "${ARCHIVE}.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: libSDL2-miyoo-${{ matrix.variant }}-${{ needs.preflight.outputs.target_sha }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: libSDL2-miyoo-*-${{ needs.preflight.outputs.target_sha }}
          path: output
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
        run: |
          ls -la output
          gh release create "$RELEASE_TAG" \
            output/*.tar.gz \
            output/*.tar.gz.sha256 \
            --target "$TARGET_SHA" \
            --title "SDL2 Miyoo $TARGET_SHA" \
            --notes "$(cat <<NOTES
          ## SDL2 for Miyoo Mini

          Commit marker: \`$TARGET_SHA\`

          Cross-compiled for \`arm-linux-gnueabihf\` using the miyoomini-toolchain.

          ### Artifacts
          | Variant | Archive |
          |---------|---------|
          | Non-GL | \`libSDL2-miyoo-nogl-$TARGET_SHA.tar.gz\` |
          | GL/EGL | \`libSDL2-miyoo-gles-$TARGET_SHA.tar.gz\` |

          Each archive includes \`libSDL2-2.0.so.0\`, the Neon helper
          (\`libneonarmmiyoo.so\`); the GL/EGL archive additionally includes
          \`libEGL.so\` and \`libGLESv2.so\`. Every archive also carries a
          \`SHA256SUMS.txt\` covering its libraries and a build-info file with
          the commit marker and build variant.

          ### Build info
          - Commit: $TARGET_SHA
          - Toolchain: [XK9274/union-miyoomini-toolchain](https://github.com/XK9274/union-miyoomini-toolchain)
          - Neon helper: [XK9274/neon-arm-library-miyoo](https://github.com/XK9274/neon-arm-library-miyoo)
          NOTES
          )"
